<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mart-fragments :: martHead(${editing} ? 'Edit Product' : 'New Product')}"></head>
<body>

<header th:replace="~{mart-fragments :: martNavbar(${user}, ${cartCount}, 'products')}"></header>

<main class="container narrow">
    <div class="section-head">
        <h2 th:text="${editing} ? 'Edit Product' : 'Add New Product'">Product</h2>
    </div>

    <form class="card form-card"
          th:action="${editing} ? '/seller/products/' + ${product.id} + '/edit' : '/seller/products'"
          th:object="${productRequest}" method="post">

        <label for="name">Product Name</label>
        <input id="name" type="text" th:field="*{name}" placeholder="e.g. Fresh Coconut" required>
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label for="category">Category</label>
        <select id="category" th:field="*{category}">
            <option th:each="c : ${categories}"
                    th:value="${c.name()}" th:text="${c.label}">Category</option>
        </select>
        <p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>

        <div class="form-row">
            <div>
                <label for="price">Price (₹)</label>
                <input id="price" type="number" step="0.01" min="0" th:field="*{price}" placeholder="45.00" required>
                <p class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
            </div>
            <div>
                <label for="unit">Unit</label>
                <select id="unit" th:field="*{unit}">
                    <option value="kg">kg</option>
                    <option value="g">g</option>
                    <option value="L">L</option>
                    <option value="100g">100g</option>
                    <option value="pack">pack</option>
                    <option value="piece">piece</option>
                    <option value="dozen">dozen</option>
                    <option value="bunch">bunch</option>
                    <option value="250g">250g</option>
                    <option value="500g">500g</option>
                    <option value="200ml">200ml</option>
                    <option value="500ml">500ml</option>
                    <option value="750ml">750ml</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div>
                <label for="stock">Stock</label>
                <input id="stock" type="number" step="1" min="0" th:field="*{stock}" placeholder="50" required>
                <p class="field-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>
            </div>
            <div>
                <label for="minStock">Min Stock (low-stock alert)</label>
                <input id="minStock" type="number" step="1" min="0" th:field="*{minStock}" placeholder="10">
                <p class="field-error" th:if="${#fields.hasErrors('minStock')}" th:errors="*{minStock}"></p>
            </div>
            <div>
                <label for="discountPercent">Discount %</label>
                <input id="discountPercent" type="number" step="1" min="0" max="90" th:field="*{discountPercent}" placeholder="0">
                <p class="field-error" th:if="${#fields.hasErrors('discountPercent')}" th:errors="*{discountPercent}"></p>
            </div>
        </div>

        <label for="imageUrl">Image URL <span class="muted">(optional)</span></label>
        <input id="imageUrl" type="url" th:field="*{imageUrl}" placeholder="https://...">
        <p class="field-error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></p>

        <label for="description">Description</label>
        <textarea id="description" th:field="*{description}" rows="3" placeholder="Describe the product"></textarea>
        <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

        <button class="btn btn-mart btn-block" type="submit" th:text="${editing} ? 'Save Changes' : 'Add Product'">Save</button>
        <a class="btn btn-outline btn-block" th:href="@{/seller/products}">Cancel</a>
    </form>
</main>

</body>
</html>
