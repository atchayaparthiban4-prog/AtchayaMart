<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mart-fragments :: martHead('Stock Management')}"></head>
<body>

<header th:replace="~{mart-fragments :: martNavbar(${user}, ${cartCount}, 'admin')}"></header>

<main class="container">
    <div class="alert alert-error" th:if="${param.error == 'notfound'}">Product not found.</div>

    <div class="section-head">
        <h2>Stock Management</h2>
        <div class="head-actions">
            <form class="search-form" th:action="@{/admin/stock}" method="get">
                <input type="text" name="q" th:value="${q}" placeholder="Search products..." data-submit>
                <button class="btn btn-mart btn-sm" type="submit">Search</button>
            </form>
            <a class="btn btn-mart" th:href="@{/admin/product/new}">➕ Add Product</a>
        </div>
    </div>

    <table class="table summary stock-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Unit</th>
                <th>Min Stock</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products}">
                <td class="strong" th:text="${p.name}">Tomato</td>
                <td th:text="${p.category.label}">Vegetables</td>
                <td th:text="${p.stock}">10</td>
                <td th:text="${p.unit}">kg</td>
                <td th:text="${p.minStock}">5</td>
                <td>
                    <span class="status-badge"
                          th:classappend="${p.isOutOfStock()} ? 'out' : (${p.isLowStock()} ? 'low' : 'ok')"
                          th:text="${p.isOutOfStock()} ? 'Out of Stock' : (${p.isLowStock()} ? 'Low Stock' : 'In Stock')">In Stock</span>
                </td>
                <td>
                    <div class="row-actions">
                        <form th:action="@{/admin/stock/{id}/adjust(id=${p.id})}" method="post">
                            <input type="number" name="amount" value="0" class="amount-input" step="1">
                            <button class="btn btn-mart btn-sm" type="submit">Adjust</button>
                        </form>
                        <a class="btn btn-sm btn-outline" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Edit</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                              onsubmit="return confirm('Delete ' + '${p.name}' + '?');">
                            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${products.isEmpty()}">
        <h3>No products found</h3>
    </div>
</main>

<script th:replace="~{mart-fragments :: martScripts}"></script>
</body>
</html>
