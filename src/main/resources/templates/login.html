<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body>

<header th:replace="~{fragments :: navbar(${user})}"></header>

<main class="container auth-wrap">
    <form class="auth-card" th:action="@{/login}" th:object="${loginRequest}" method="post">

        <h2>Login</h2>

        <div class="alert alert-success" th:if="${param.registered}">
            Registration successful! Please login.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You have been logged out.
        </div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" placeholder="you@example.com" required>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input id="password" type="password" th:field="*{password}" placeholder="Your password" required>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button class="btn btn-primary btn-block" type="submit">Login</button>

        <p class="auth-alt">Don't have an account? <a th:href="@{/register}">Register here</a></p>
        <p class="auth-demo">Demo admin: <code>admin@atchayamart.com</code> / <code>admin123</code></p>
    </form>
</main>

</body>
</html>
