<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mart-fragments :: martHead('Cart')}"></head>
<body>

<header th:replace="~{mart-fragments :: martNavbar(${user}, ${cartCount}, 'cart')}"></header>

<main class="container cart-layout">
    <div class="cart-items">
        <div class="section-head">
            <h2>Shopping Cart</h2>
            <span class="muted">You have <strong th:text="${cartCount}">0</strong> items</span>
        </div>

        <div class="empty-state" th:if="${entries.isEmpty()}">
            <h3>Your cart is empty</h3>
            <p>Add some groceries and they will show up here.</p>
            <a class="btn btn-mart" th:href="@{/products}">Start Shopping</a>
        </div>

        <th:block th:if="${!entries.isEmpty()}">
            <div class="cart-row" th:each="e : ${entries}">
                <div class="cart-thumb">
                    <img th:if="${e.product.hasImage()}" th:src="${e.product.imageUrl}" alt="">
                    <span th:unless="${e.product.hasImage()}" th:text="${e.product.category.icon}">🍎</span>
                </div>
                <div class="cart-info">
                    <a class="cart-name" th:href="@{/products/{id}(id=${e.product.id})}" th:text="${e.product.name}">Tomato</a>
                    <span class="muted" th:text="'₹' + ${#numbers.formatDecimal(e.product.discountedPrice, 1, 2)} + ' / ' + ${e.product.unit}">₹40 / kg</span>
                    <span class="stock-text" th:text="'Stock: ' + ${e.product.stock} + ' ' + ${e.product.unit}">Stock: 10 kg</span>
                </div>
                <form class="stepper" th:action="@{/cart/update}" method="post">
                    <input type="hidden" name="productId" th:value="${e.product.id}">
                    <button type="button" class="step-btn" onclick="stepQty(this, -1); this.form.submit();">−</button>
                    <input class="qty" type="number" name="qty" th:value="${e.quantity}" min="1" th:max="${e.product.stock}">
                    <button type="button" class="step-btn" onclick="stepQty(this, 1); this.form.submit();">+</button>
                </form>
                <div class="cart-total" th:text="'₹' + ${#numbers.formatDecimal(e.lineTotal, 1, 2)}">₹80.00</div>
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${e.product.id}">
                    <button class="btn btn-sm btn-danger" type="submit">Remove</button>
                </form>
            </div>

            <form class="clear-cart" th:action="@{/cart/clear}" method="post">
                <button class="btn btn-sm btn-outline" type="submit">Clear Cart</button>
            </form>
        </th:block>
    </div>

    <aside class="summary-card" th:if="${!entries.isEmpty()}">
        <h3>Order Summary</h3>
        <div class="summary-row"><span>Subtotal</span><span th:text="'₹' + ${#numbers.formatDecimal(subtotal, 1, 2)}">₹0.00</span></div>
        <div class="summary-row discount" th:if="${discount.signum() > 0}"><span>Discount</span><span th:text="'- ₹' + ${#numbers.formatDecimal(discount, 1, 2)}">-₹0.00</span></div>
        <div class="summary-row total"><span>Total</span><span th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹0.00</span></div>
        <a class="btn btn-mart btn-block" th:href="@{/checkout}">Checkout →</a>
        <a class="btn btn-outline btn-block" th:href="@{/products}">Continue Shopping</a>
    </aside>
</main>

<script th:replace="~{mart-fragments :: martScripts}"></script>
</body>
</html>
