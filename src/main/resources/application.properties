spring.application.name=AtchayaMart

# ---- Server port ----
# Render assigns the port at runtime through the $PORT environment variable.
# When $PORT is missing (local Windows run), fall back to 8080.
server.port=${PORT:8080}

# ---- Embedded H2 database ----
# The URL comes from SPRING_DATASOURCE_URL when it is set, so the same build can
# run locally and on Render without editing code.
# Default is a portable RELATIVE path (no Windows drive letter, valid on Linux).
# On Render, if you have no persistent disk, point it at an in-memory database:
#   SPRING_DATASOURCE_URL=jdbc:h2:mem:atchayamart;DB_CLOSE_DELAY=-1
# (products/admin/seller are re-seeded automatically on every start)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/atchayamart}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- H2 web console (local development) ----
# Set H2_CONSOLE_ENABLED=false on Render so the database console is not public.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# ---- Thymeleaf ----
spring.thymeleaf.cache=false